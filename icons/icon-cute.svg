<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef7e6"/>
      <stop offset="100%" stop-color="#d9ecc8"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7c98e"/>
      <stop offset="100%" stop-color="#eeb06a"/>
    </linearGradient>
  </defs>

  <!-- fond doux -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>

  <!-- feuilles douces en arrière-plan -->
  <path d="M20 45 C40 20 65 15 80 30 C65 35 50 50 45 70 C30 65 18 58 20 45 Z" fill="#a9cf8a" opacity="0.85"/>
  <path d="M180 40 C160 15 135 12 120 28 C136 32 150 48 155 68 C170 62 182 54 180 40 Z" fill="#8fbf74" opacity="0.85"/>
  <path d="M25 165 C35 145 55 138 68 148 C55 152 45 163 42 178 C32 176 22 175 25 165 Z" fill="#a9cf8a" opacity="0.7"/>
  <path d="M175 165 C165 145 145 138 132 148 C145 152 155 163 158 178 C168 176 178 175 175 165 Z" fill="#8fbf74" opacity="0.7"/>

  <!-- tête d'animal mignon et générique (tigre stylisé, rond et doux) -->
  <g>
    <!-- oreilles -->
    <circle cx="68" cy="72" r="20" fill="url(#fur)"/>
    <circle cx="132" cy="72" r="20" fill="url(#fur)"/>
    <circle cx="68" cy="74" r="10" fill="#fff3e0"/>
    <circle cx="132" cy="74" r="10" fill="#fff3e0"/>

    <!-- visage -->
    <ellipse cx="100" cy="115" rx="52" ry="46" fill="url(#fur)"/>

    <!-- museau -->
    <ellipse cx="100" cy="130" rx="26" ry="20" fill="#fff3e0"/>

    <!-- rayures douces -->
    <path d="M55 90 q10 -14 24 -10" stroke="#c97b3a" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M145 90 q-10 -14 -24 -10" stroke="#c97b3a" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M62 128 q10 6 20 2" stroke="#c97b3a" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M138 128 q-10 6 -20 2" stroke="#c97b3a" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>

    <!-- yeux -->
    <circle cx="82" cy="108" r="7" fill="#3a2b20"/>
    <circle cx="118" cy="108" r="7" fill="#3a2b20"/>
    <circle cx="84.5" cy="105.5" r="2.2" fill="#fff"/>
    <circle cx="120.5" cy="105.5" r="2.2" fill="#fff"/>

    <!-- joues roses -->
    <ellipse cx="72" cy="122" rx="8" ry="5" fill="#f2a3a3" opacity="0.6"/>
    <ellipse cx="128" cy="122" rx="8" ry="5" fill="#f2a3a3" opacity="0.6"/>

    <!-- nez et bouche -->
    <path d="M94 126 q6 5 12 0" stroke="#3a2b20" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="122" r="4" fill="#3a2b20"/>
    <path d="M100 126 v4" stroke="#3a2b20" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M100 130 q-8 8 -16 3" stroke="#3a2b20" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M100 130 q8 8 16 3" stroke="#3a2b20" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
